<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4A2C17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Café Mantiqueira">
<link rel="apple-touch-icon" href="/painel/apple-touch-icon.png">
<link rel="icon" href="/painel/icon-192.png">
<title>Café da Mantiqueira</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F3EC;--card:#fff;--ink:#2A1A0F;--ink2:#5E4E40;--ink3:#8A7A6B;--line:#E4DCCD;--brown:#4A2C17;--soft:#EFE8DC;--err:#A52A1F;--err-bg:#FBE4E1;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17120E;--card:#221B15;--ink:#F5EEE6;--ink2:#CDBFB0;--ink3:#9C8C7C;--line:#3A2F25;--brown:#E8C9A8;--soft:#2E251D;--err:#F2A097;--err-bg:#3A1F1C;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17120E;--card:#221B15;--ink:#F5EEE6;--ink2:#CDBFB0;--ink3:#9C8C7C;--line:#3A2F25;--brown:#E8C9A8;--soft:#2E251D;--err:#F2A097;--err-bg:#3A1F1C;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:17px/1.45 Inter,system-ui,sans-serif;-webkit-text-size-adjust:100%;display:flex;flex-direction:column}
.topo{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 16px 8px;border-bottom:1px solid var(--line);background:var(--bg)}
.topo h1{font-size:18px;font-weight:800;color:var(--brown);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lojas{display:flex;gap:4px;background:var(--soft);padding:3px;border-radius:10px}
.lojas button{border:0;background:none;font:600 14px Inter,sans-serif;color:var(--ink2);padding:8px 12px;border-radius:8px;cursor:pointer;min-height:38px}
.lojas button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.sair{background:none;border:0;color:var(--ink3);font:600 14px Inter,sans-serif;cursor:pointer;padding:8px 0 8px 4px}
main{flex:1;min-height:0;position:relative}
main iframe{border:0;width:100%;height:100%;display:block;background:var(--bg)}
.pagina{height:100%;overflow:auto;padding:16px}
.pagina>div{max-width:560px;margin:0 auto}
nav{display:grid;grid-template-columns:repeat(6,1fr);border-top:1px solid var(--line);background:var(--card);padding-bottom:env(safe-area-inset-bottom)}
nav button{border:0;background:none;color:var(--ink3);font:600 11px Inter,sans-serif;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;min-height:58px}
nav button span{font-size:22px;line-height:1;filter:grayscale(.2)}
nav button.on{color:var(--brown)}
nav button.breve{opacity:.55}
.breveTag{display:inline-block;background:var(--soft);color:var(--ink2);font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;margin-bottom:10px}
.pagina h2{font-size:24px;margin-bottom:6px}
.pagina p{color:var(--ink2)}
.pagina ul{margin:14px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.pagina li{color:var(--ink)}
.quando{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15px;color:var(--ink2)}
.form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 16px;margin:24px auto 0;max-width:420px;display:flex;flex-direction:column;gap:12px}
.form h2{font-size:22px}
label{font-size:15px;font-weight:600;color:var(--ink2);display:flex;flex-direction:column;gap:6px}
input{font:600 20px Inter,sans-serif;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.btn{min-height:54px;border-radius:12px;border:0;background:var(--brown);color:var(--card);font:700 18px Inter,sans-serif;cursor:pointer}
.erro{background:var(--err-bg);color:var(--err);padding:10px 12px;border-radius:10px;font-size:15px}
.vazio{color:var(--ink2);text-align:center;padding:40px 16px}
[hidden]{display:none!important}
@media (min-width:700px){nav{max-width:700px;margin:0 auto;width:100%;border:1px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0}}
</style>
</head>
<body>
<div class="topo" id="topo" hidden>
  <h1>☕ Mantiqueira</h1>
  <div class="lojas" id="lojas"></div>
  <button class="sair" id="sair">Sair</button>
</div>
<main id="main"><p class="vazio">Carregando…</p></main>
<nav id="nav" hidden></nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// Chave pública ("publishable") do banco: feita para ficar no navegador. Sem login, o banco não devolve nada.
const sb = supabase.createClient('https://moqxgwzrovqlnzsofwei.supabase.co', 'sb_publishable_FDHUB0uTRDlUimLMz5Es0Q_fZujEsUa');
const DOMINIO_LOGIN = '@cafemantiqueira.com';

// Os módulos do sistema. "pagina" = já funciona; "breve" = o que vem a seguir.
const MODULOS = [
  { id: 'painel', nome: 'Painel', icone: '📊', pagina: loja => `/painel/?sistema=1&loja=${loja}` },
  { id: 'producao', nome: 'Produção', icone: '🧁', pagina: loja => `/producao/?embutido=1&loja=${loja}` },
  { id: 'cozinha', nome: 'Cozinha', icone: '🍳', breve: {
      titulo: 'Tela da cozinha',
      texto: 'Os pedidos aparecem numa tela na cozinha, na ordem de chegada, com o tempo de espera.',
      itens: ['Bebidas vão para a tela do bar; comida, para a da cozinha', 'Tocar em "pronto" avisa o balcão',
              'Pedido atrasado fica vermelho', 'Tempo médio de preparo de cada item, por dia e horário',
              'Impressão na térmica para quem preferir papel'],
      quando: 'Junto com as Comandas, depois da abertura da praça.' } },
  { id: 'comandas', nome: 'Comandas', icone: '🧾', breve: {
      titulo: 'Comandas e pedido pelo celular',
      texto: 'O garçom lança o pedido no celular ou tablet, e o cliente também pode pedir sozinho pelo QR Code da mesa.',
      itens: ['Comanda própria de cada cliente, aberta pelo QR da mesa', 'Cadastro rápido: nome e WhatsApp; aniversário e CPF opcionais',
              'Primeiro pedido confirmado pelo garçom (evita trote)', 'Pesquisa de satisfação depois da visita',
              'Fechamento da conta com cupom fiscal (Focus NFe)'],
      quando: 'Dezembro e janeiro, testando primeiro numa loja. Até lá, a venda segue pelo GrandChef.' } },
  { id: 'estoque', nome: 'Estoque', icone: '📦', breve: {
      titulo: 'Estoque',
      texto: 'Saber o que tem, o que está acabando e o que comprar.',
      itens: ['Entrada pela nota do fornecedor', 'Baixa automática pela venda, usando a ficha técnica',
              'Contagem com diferença', 'Aviso de estoque baixo e de validade', 'Lista de compras pronta'],
      quando: 'Depois das Comandas.' } },
  { id: 'financeiro', nome: 'Financeiro', icone: '💰', breve: {
      titulo: 'Financeiro',
      texto: 'O lugar do Fingu: o extrato do banco é a verdade, e o resultado do mês sai sozinho.',
      itens: ['Subir o extrato do banco sem duplicar lançamento', 'Categoria sugerida automaticamente, aprendendo com as escolhas',
              'Resultado do mês (DRE) por loja', 'Fluxo de caixa e contas a pagar', 'Fechamento de caixa diário entrando sozinho'],
      quando: 'Depois do Estoque. Antes de desligar o Fingu, um mês inteiro precisa bater no centavo.' } },
];

const guarda = { ler(k) { try { return localStorage.getItem(k); } catch { return null; } }, por(k, v) { try { localStorage.setItem(k, v); } catch {} } };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const main = document.getElementById('main'), nav = document.getElementById('nav'), topo = document.getElementById('topo');
const estado = { eu: null, loja: null, modulo: null };

function telaLogin(erro) {
  topo.hidden = true; nav.hidden = true;
  main.innerHTML = `<div class="pagina"><form class="form" id="f">
      <h2>Café da Mantiqueira</h2>
      ${erro ? `<div class="erro">${esc(erro)}</div>` : ''}
      <label>Login <input id="login" autocomplete="username" autocapitalize="none" required></label>
      <label>Senha <input id="senha" type="password" autocomplete="current-password" required></label>
      <button class="btn">Entrar</button>
    </form></div>`;
  document.getElementById('f').onsubmit = async ev => {
    ev.preventDefault();
    let login = document.getElementById('login').value.trim().toLowerCase();
    if (!login.includes('@')) login += DOMINIO_LOGIN;
    const { error } = await sb.auth.signInWithPassword({ email: login, password: document.getElementById('senha').value });
    if (error) return telaLogin('Login ou senha não conferem.');
    iniciar();
  };
}

function desenharTopo() {
  const lojas = estado.eu.lojas;
  document.getElementById('lojas').innerHTML = lojas.length > 1 ? lojas.map(l =>
    `<button data-loja="${l.id}" class="${l.id === estado.loja ? 'on' : ''}">${l.slug === 'praca' ? 'Praça' : 'Estrada'}</button>`).join('') : '';
  document.querySelectorAll('[data-loja]').forEach(b => b.onclick = () => {
    estado.loja = Number(b.dataset.loja); guarda.por('sis_loja', estado.loja); desenharTopo(); abrir(estado.modulo);
  });
  nav.innerHTML = MODULOS.map(m =>
    `<button data-mod="${m.id}" class="${m.id === estado.modulo ? 'on' : ''} ${m.breve ? 'breve' : ''}"><span>${m.icone}</span>${m.nome}</button>`).join('');
  nav.querySelectorAll('[data-mod]').forEach(b => b.onclick = () => abrir(b.dataset.mod));
}

function abrir(id) {
  const m = MODULOS.find(x => x.id === id) || MODULOS[0];
  estado.modulo = m.id; guarda.por('sis_modulo', m.id);
  if (location.hash !== '#' + m.id) history.replaceState(null, '', '#' + m.id);
  desenharTopo();
  if (m.pagina) {
    main.innerHTML = `<iframe title="${esc(m.nome)}" src="${m.pagina(estado.loja)}"></iframe>`;
  } else {
    const b = m.breve;
    main.innerHTML = `<div class="pagina"><div>
      <span class="breveTag">Em breve</span>
      <h2>${m.icone} ${esc(b.titulo)}</h2>
      <p>${esc(b.texto)}</p>
      <ul>${b.itens.map(i => `<li>${esc(i)}</li>`).join('')}</ul>
      <div class="quando"><b>Quando:</b> ${esc(b.quando)}</div>
    </div></div>`;
  }
}

async function iniciar() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return telaLogin();
  const { data: eu, error } = await sb.schema('core').rpc('eu');
  if (error || !eu) { topo.hidden = true; nav.hidden = true; main.innerHTML = '<p class="vazio">Este login ainda não foi liberado no sistema. Fale com a gestão.</p>'; return; }
  estado.eu = eu;
  const salva = Number(guarda.ler('sis_loja'));
  estado.loja = eu.lojas.some(l => l.id === salva) ? salva : eu.lojas[0]?.id;
  topo.hidden = false; nav.hidden = false;
  abrir(location.hash.slice(1) || guarda.ler('sis_modulo') || 'painel');
}

document.getElementById('sair').onclick = async () => { await sb.auth.signOut(); telaLogin(); };
iniciar();
</script>
</body>
</html>
