name: Café Hoje diário

on:
  schedule:
    - cron: '15 21 * * *'   # 18:15 em Brasília: coleta o dia de hoje
    - cron: '0 11 * * *'    # 08:00 em Brasília: recoleta ontem (pega pedidos fechados tarde)
    - cron: '0 13-20 * * *' # 10h às 17h em Brasília, de hora em hora: atualiza o painel com o dia parcial (sem WhatsApp)
  workflow_dispatch:
    inputs:
      inicio:
        description: 'Data inicial (AAAA-MM-DD). Vazio = hoje'
        required: false
      fim:
        description: 'Data final (AAAA-MM-DD). Vazio = igual à inicial'
        required: false
      whatsapp:
        description: 'Mandar WhatsApp?'
        type: boolean
        default: false

concurrency:
  group: cafe-hoje        # nunca roda duas coletas ao mesmo tempo (a segunda espera a primeira)
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Coletar GrandChef e gravar na planilha
        env:
          GC_DEVICE: ${{ secrets.GC_DEVICE }}
          GC_REFRESH: ${{ secrets.GC_REFRESH }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          CAFE_KEY: ${{ secrets.CAFE_KEY }}
          WPP_DESTINOS: ${{ secrets.WPP_DESTINOS }}
          ENVIAR_WPP: ${{ (github.event.schedule == '15 21 * * *' || github.event.inputs.whatsapp == 'true') && '1' || '0' }}
          TZ: America/Sao_Paulo
        run: |
          INI="${{ github.event.inputs.inicio }}"
          FIM="${{ github.event.inputs.fim }}"
          if [ -z "$INI" ]; then
            if [ "${{ github.event.schedule }}" = "0 11 * * *" ]; then INI=$(date -d yesterday +%F); else INI=$(date +%F); fi
          fi
          node coletor.mjs "$INI" ${FIM:-$INI}
