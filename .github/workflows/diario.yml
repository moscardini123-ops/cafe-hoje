name: Café Hoje diário

on:
  # horários agora são disparados pelo Google (Apps Script → Gatilhos.gs); o agendamento do GitHub era instável
  workflow_dispatch:
    inputs:
      inicio:
        description: 'Data inicial (AAAA-MM-DD). Vazio = hoje'
        required: false
      fim:
        description: 'Data final (AAAA-MM-DD). Vazio = igual à inicial'
        required: false
      whatsapp:
        description: 'Mandar WhatsApp?'
        type: boolean
        default: false
      modo:
        description: 'diario = coleta do GrandChef · semana = resumo da semana · mes = fechamento do mês'
        type: choice
        options: [diario, semana, mes]
        default: diario

concurrency:
  # importações de histórico (com data inicial) numa fila; rotina diária em outra — uma nunca atrasa a outra
  group: ${{ github.event.inputs.modo != '' && github.event.inputs.modo != 'diario' && 'cafe-resumo' || (github.event.inputs.inicio && 'cafe-importacao' || 'cafe-diario') }}
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Coletar GrandChef e gravar na planilha
        env:
          GC_DEVICE: ${{ secrets.GC_DEVICE }}
          GC_REFRESH: ${{ secrets.GC_REFRESH }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          CAFE_KEY: ${{ secrets.CAFE_KEY }}
          WPP_DESTINOS: ${{ secrets.WPP_DESTINOS }}
          ENVIAR_WPP: ${{ (github.event.schedule == '15 21 * * *' || github.event.inputs.whatsapp == 'true') && '1' || '0' }}
          TZ: America/Sao_Paulo
        run: |
          MODO="${{ github.event.inputs.modo || 'diario' }}"
          if [ "$MODO" != "diario" ]; then
            MODO="$MODO" ENVIAR_WPP="${{ github.event.inputs.whatsapp == 'false' && '0' || '1' }}" node resumo.mjs ${{ github.event.inputs.inicio }}
            exit 0
          fi
          INI="${{ github.event.inputs.inicio }}"
          FIM="${{ github.event.inputs.fim }}"
          if [ -z "$INI" ]; then
            if [ "${{ github.event.schedule }}" = "0 11 * * *" ]; then INI=$(date -d yesterday +%F); else INI=$(date +%F); fi
          fi
          node coletor.mjs "$INI" ${FIM:-$INI}
